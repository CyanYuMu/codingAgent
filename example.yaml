# codeclaw 配置模板
# 三层配置（后者覆盖前者）：
#   1. ~/.codeclaw/config.yaml          用户级（推荐放 models 与 api_key）
#   2. <项目>/.codeclaw/config.yaml     项目级（审批/委派/MCP 等项目约定）
#   3. ./config.yaml                    仓库内 legacy（向后兼容）
# 数据目录：$CODECLAW_HOME 或 ~/.codeclaw；每个项目的会话/产物/记忆在 ~/.codeclaw/projects/<encoded-cwd>/

# 审批模式：控制哪些工具需要弹出「人机审批」窗口
#   write      —— read/write 放行，exec（bash 执行命令等）询问（默认）
#   always-ask —— 只有 read 放行，write/exec 都询问
#   yolo       —— 全部放行（无弹窗；命令行 --yolo 可临时强制）
approval_mode: write

# 委派模式：控制主 agent 是否主动委派给子 agent
#   conservative —— 不委派（除非用户明确要求）
#   preferred    —— 优先委派（默认）
#   always       —— 必须委派（主 agent 只有只读工具 + task/remember，写与执行必须派子 agent）
delegation_mode: preferred

# 子 agent 运行时
subagent:
  max_concurrency: 4          # 并行子 agent 上限
  approval_escalation: false  # true：子 agent 需要审批时升级到主界面弹窗（带 [子 agent X] 标签）；false：直接拒绝并说明
  default_timeout: 10m        # 单个子 agent wall-clock 超时
  default_max_turns: 50       # 单个子 agent 单轮工具循环上限
  soft_budget: 200            # 累计模型请求软预算：越界注入收尾通知，1.5× 强制 yield，宽限后硬杀；0 = 关闭护栏
  max_recursion_depth: 2      # 委派递归深度上限（子 agent 再派子 agent）
  min_task_chars: 40          # 任务描述最短长度（拒绝一句话派发）
  background: true            # 允许 task 的 background:true（长任务转后台，完成后结果自动送回会话）

# 子 agent 定义（markdown frontmatter）优先级：
#   <项目>/.codeclaw/agents/*.md  →  ~/.codeclaw/agents/*.md  →  内置（explorer/reviewer/planner/worker）
# 同名 first-wins；写坏一个文件只告警跳过。字段见 docs/specs/phase-9-delegation-runtime.md §2.2

models:
  # 示例：DeepSeek
  - model_name: deepseek-chat
    model_id: deepseek-chat
    provider: deepseek
    api_key: sk-xxxxxxxxxxxxxxxx
    base_url: https://api.deepseek.com
    context_window: 128000

  # 示例：通义千问（阿里云百炼）
  # - model_name: qwen-plus
  #   model_id: qwen-plus
  #   provider: qwen
  #   api_key: sk-xxxxxxxxxxxxxxxx
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   enable_thinking: false

  # 示例：OpenAI 兼容接口
  # - model_name: gpt-4o
  #   model_id: gpt-4o
  #   provider: openai
  #   api_key: sk-xxxxxxxxxxxxxxxx
  #   base_url: https://api.openai.com/v1

# 外部 MCP server（stdio）；其工具归一为 mcp__<name>_<tool>，默认按 write tier 审批
